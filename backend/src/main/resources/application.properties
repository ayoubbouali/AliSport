spring.application.name=gym-manager
server.port=${PORT:8090}

# Data directory (database file in H2 mode + uploaded photos/logo)
app.data-dir=${DATA_DIR:${user.dir}/data}
app.seed.enabled=true

# Default database: H2 embedded file in PostgreSQL compatibility mode (zero install).
# Use the "postgres" profile for PostgreSQL (see application-postgres.properties).
spring.datasource.url=jdbc:h2:file:${app.data-dir}/gym;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=200
spring.flyway.locations=classpath:db/migration

# Sessions: HttpOnly cookie, SameSite=Strict (CSRF protection for the SPA)
server.servlet.session.timeout=12h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.name=GM_SESSION

# 10 MB for Excel imports (images are limited to 2 MB by FileStorage)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
server.error.include-message=always
