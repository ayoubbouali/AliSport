spring.application.name=gym-manager-test
app.data-dir=${java.io.tmpdir}/gym-manager-test
app.seed.enabled=true
spring.datasource.url=jdbc:h2:mem:gym-${random.uuid};MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=200
spring.flyway.locations=classpath:db/migration
spring.servlet.multipart.max-file-size=10MB
spring.main.allow-bean-definition-overriding=true
